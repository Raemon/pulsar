name: CI

on:
  push: { branches: [main] }
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck + replay determinism
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Closed-loop record then re-sim
        run: npm run replay:closed-loop
      - name: Verify golden replay
        run: npm run replay:golden:verify
      - name: Sepulchre gameplay rules
        run: node --import tsx --test scripts/check-sepulchre-gameplay.mjs
